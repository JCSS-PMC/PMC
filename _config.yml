# Book settings
title: Probabilistic Model Code
author: Joint Committee on Structural Safety
logo: jcss.png

latex:
  latex_documents:
    targetname: book.tex

repository:
  url: https://github.com/JCSS-PMC/PMC
  branch: master

html:
  use_edit_page_button: true
  use_repository_button: true
  use_issues_button: true
  extra_navbar: ""

parse:
  # myst_extended_syntax: true
  myst_enable_extensions:
    - amsmath
    - dollarmath


bibtex_bibfiles:
    - references.bib

# Keep repository documentation outside the reader and its search index.
only_build_toc_files: true
sphinx:
  local_extensions:
    reader_controls: _ext
  config:
    templates_path: ["_templates"]
    html_static_path: ["_static"]
    html_css_files: ["reader-controls.css"]
    html_js_files: ["reader-theme.js", "reader-navigation.js"]

